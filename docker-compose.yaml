name: sorokchat
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sorokchat.gateway
    env_file: .env.production.local
    networks:
      - sorokchat
    restart: unless-stopped
    ports:
      - "8080:8080"

networks:
  sorokchat:
    name: sorokchat
  